name: Daily Job Scraper

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-jobspy gspread google-auth

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDS_JSON }}' > credentials.json

      - name: Run scraper 1 (Engineering Part 1)
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_FILE: credentials.json
        run: python3 scraper1.py

      - name: Run scraper 2 (Engineering Part 2 + Energy + Planning)
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_FILE: credentials.json
        run: python3 scraper2.py

      - name: Run scraper 3 (Marketing + Finance)
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_FILE: credentials.json
        run: python3 scraper3.py

      - name: Run scraper 4 (Banking + Technology)
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_FILE: credentials.json
        run: python3 scraper4.py

      - name: Run scraper 5 (Healthcare + Business + BD + Science)
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_FILE: credentials.json
        run: python3 scraper5.py
